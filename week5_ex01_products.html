<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="week5_ex01_style.css">
</head>
<body>
    <header>
        <h1>Our Products</h1>
    </header>

    <main class="product-grid">
        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Product 1">
            <h3>Product One</h3>
            <p class="price">$29.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Product 2">
            <h3>Product Two</h3>
            <p class="price">$39.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Product 3">
            <h3>Product Three</h3>
            <p class="price">$19.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Product 4">
            <h3>Product Four</h3>
            <p class="price">$49.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Product 5">
            <h3>Product Five</h3>
            <p class="price">$24.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x200" alt="Product 6">
            <h3>Product Six</h3>
            <p class="price">$34.99</p>
            <button class="add-to-cart">Add to Cart</button>
        </div>
    </main>
</body>
</html>
