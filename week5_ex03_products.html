<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Animation -->
    <div class="loader">
        <div class="spinner"></div>
    </div>

    <!-- Navigation Menu with Animation -->
    <nav>
        <div class="logo">Brand</div>
        <ul class="nav-menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section with Animated Background -->
    <section class="hero">
        <div class="hero-content">
            <h1>Welcome to Our Store</h1>
            <p>Discover amazing products with stunning animations</p>
            <button class="cta-btn">Shop Now</button>
        </div>
        <div class="skew-decor"></div>
    </section>

    <!-- Featured Product Cards -->
    <section class="products">
        <h2>Featured Products</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="icon">📱</div>
                <img src="https://via.placeholder.com/250x200" alt="Product 1">
                <h3>Product One</h3>
                <p>$29.99</p>
                <button class="card-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="icon">💻</div>
                <img src="https://via.placeholder.com/250x200" alt="Product 2">
                <h3>Product Two</h3>
                <p>$49.99</p>
                <button class="card-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="icon">🎧</div>
                <img src="https://via.placeholder.com/250x200" alt="Product 3">
                <h3>Product Three</h3>
                <p>$39.99</p>
                <button class="card-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="icon">⌚</div>
                <img src="https://via.placeholder.com/250x200" alt="Product 4">
                <h3>Product Four</h3>
                <p>$59.99</p>
                <button class="card-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="icon">📷</div>
                <img src="https://via.placeholder.com/250x200" alt="Product 5">
                <h3>Product Five</h3>
                <p>$79.99</p>
                <button class="card-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <div class="icon">🎮</div>
                <img src="https://via.placeholder.com/250x200" alt="Product 6">
                <h3>Product Six</h3>
                <p>$44.99</p>
                <button class="card-btn">Add to Cart</button>
            </div>
        </div>
    </section>

    <script>
        // Hide loader after page loads
        window.addEventListener('load', () => {
            document.querySelector('.loader').style.display = 'none';
        });
    </script>
</body>
</html>
